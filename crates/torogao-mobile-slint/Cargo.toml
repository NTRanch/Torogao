[package]
name = "torogao-mobile-slint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Torogao Mobile phone shell (Slint): cast picker, scene prompt, generation status, and gallery over torogao-mobile-core. Builds as a cdylib for Android (NativeActivity) and as a host binary for off-device checks."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1", features = ["backend-android-activity-06"] }
torogao-mobile-core = { path = "../torogao-mobile-core" }

[build-dependencies]
slint-build = "1"

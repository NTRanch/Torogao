[package]
name = "torogao"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Torogao command-line tools: the registry, MCP and A2A servers, scenes, writer, tutorials, toolbox, and conversion."

[dependencies]
serde_json = { workspace = true }
sha2 = "0.10"
torogao-engine = { path = "../torogao-engine" }
torogao-format = { path = "../torogao-format" }
# WS2-W5 (D-113): the `mcp` mode's framing moves to the official
# Rust MCP SDK, modern era only (2026-07-28). The version pin is
# the fleet pin — one rmcp version across every estate server;
# bumps are single fleet events. The rest of this CLI stays
# synchronous; tokio exists only inside the mcp mode.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Stage 1.0's Torogao half (G-07/G-11 remainder): the R2
# consumption gate test links the estate's one rig runtime
# at its landed main, pinned by rev so the gate's numbers
# always name the exact evaluator they were taken against.
lumen-rig-core = { git = "https://github.com/qompassai/lumen", rev = "16e4cfc8a41914bc17f3c3fdb87af434a47b4871" }

[lib]
name = "torogao_cli"
path = "src/lib.rs"

[[bin]]
name = "torogao"
path = "src/main.rs"

[[bin]]
name = "rig-check"
path = "src/bin/rig-check.rs"

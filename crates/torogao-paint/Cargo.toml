[package]
name = "torogao-paint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The torogao-paint document core: a sparse tile-based layered raster document with a deterministic op log (torogao-paint/1), blend modes in integer arithmetic, and PNG import/export. No UI, no GPU."

[dependencies]
png = "0.18"
ron = "0.8"
serde = { workspace = true }
sha2 = "0.10"

[[bin]]
name = "paint-roundtrip"
path = "src/bin/paint_roundtrip.rs"

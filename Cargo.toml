[workspace]
members = [
    "crates/torogao-app",
    "crates/torogao-author",
    "crates/torogao-cli",
    "crates/torogao-companion",
    "crates/torogao-engine",
    "crates/torogao-format",
    "crates/torogao-jam-laws",
    "crates/torogao-osc",
    "crates/torogao-session",
    "crates/torogao-tui",
    "crates/torogao-vmc",
    "crates/torogao-voice",
]
# torogao-accel is a standalone-gated crate: it keeps its own
# [workspace] and its own gate runs, and is excluded here explicitly
# rather than by accident. Its version tracks the workspace version
# below (kept in step by hand; see the 2026-11-01 version correction
# in CHANGELOG.md).
exclude = ["crates/torogao-accel"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
version = "0.4.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [
    "crates/torogao-app",
    "crates/torogao-author",
    "crates/torogao-cli",
    "crates/torogao-coin",
    "crates/torogao-coin-android",
    "crates/torogao-companion",
    "crates/torogao-engine",
    "crates/torogao-format",
    "crates/torogao-gen",
    "crates/torogao-gencond",
    "crates/torogao-jam-laws",
    "crates/torogao-mobile-core",
    "crates/torogao-mobile-slint",
    "crates/torogao-mobile-gpui",
    "crates/torogao-mobile-facade",
    "crates/torogao-modapp",
    "crates/torogao-motion-clip",
    "crates/torogao-osc",
    "crates/torogao-paint",
    "crates/torogao-pen",
    "crates/torogao-rig",
    "crates/torogao-session",
    "crates/torogao-tui",
    "crates/torogao-tui-bakeoff-core",
    "crates/torogao-viseme",
    "crates/torogao-vmc",
    "crates/torogao-voice",
    "crates/torogao-vrm",
]
# torogao-accel is a standalone-gated crate: it keeps its own
# [workspace] and its own gate runs, and is excluded here explicitly
# rather than by accident. Its version tracks the workspace version
# below (kept in step by hand; see the 2026-11-01 version correction
# in CHANGELOG.md).
exclude = ["crates/torogao-accel"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
version = "0.5.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# gpui 0.2.2 -> gpui_http_client -> zed-async-tar 0.5.0-zed pins
# xattr 0.2.3, whose platform macro references libc::ENOATTR --
# removed from modern libc on Linux, so the crate no longer
# compiles. Vendored copy with that one constant aliased to
# ENODATA on Linux; nothing else changed. Drop this patch when
# gpui's http client moves to a maintained xattr.
xattr = { path = "crates/torogao-mobile-gpui/vendor/xattr-0.2.3" }

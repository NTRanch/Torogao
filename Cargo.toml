[workspace]
members = [
    "crates/torogao-app",
    "crates/torogao-author",
    "crates/torogao-cli",
    "crates/torogao-engine",
    "crates/torogao-format",
    "crates/torogao-gear",
    "crates/torogao-session",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
